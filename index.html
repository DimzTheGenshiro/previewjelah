<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutomationBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
      <a href="#" class="text-2xl font-bold text-indigo-600">AutomationBot</a>
      <nav class="hidden md:flex space-x-8 text-gray-700 font-semibold">
        <a href="#products" class="hover:text-indigo-600 transition">Products</a>
        <a href="#cart" class="hover:text-indigo-600 transition flex items-center">
          <i class="fas fa-shopping-cart mr-1"></i> Cart
          <span id="cart-count" class="ml-1 bg-indigo-600 text-white rounded-full px-2 text-xs font-bold">0</span>
        </a>
      </nav>
      <button id="mobile-menu-button" class="md:hidden focus:outline-none">
        <i class="fas fa-bars text-2xl text-gray-700"></i>
      </button>
    </div>
    <div id="mobile-menu" class="md:hidden hidden bg-white border-t border-gray-200">
      <a href="#products" class="block px-4 py-3 text-gray-700 font-semibold hover:bg-indigo-50">Products</a>
      <a href="#cart" class="block px-4 py-3 text-gray-700 font-semibold hover:bg-indigo-50 flex items-center">
        <i class="fas fa-shopping-cart mr-2"></i> Cart
        <span id="cart-count-mobile" class="ml-2 bg-indigo-600 text-white rounded-full px-2 text-xs font-bold">0</span>
      </a>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <section class="mb-12 text-center">
      <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Discover Premium Digital Products</h1>
      <p class="text-gray-600 max-w-2xl mx-auto text-lg">
        Browse, select, and purchase high-quality digital products with seamless payment integration.
      </p>
    </section>

    <section id="products" class="mb-16">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6">
        <h2 class="text-3xl font-bold text-gray-900 mb-4 sm:mb-0">Products</h2>
        <div class="flex flex-wrap gap-3 items-center">
          <select id="filter-category" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" aria-label="Filter by category">
            <option value="all">All Categories</option>
            <option value="script">Script</option>
            <option value="website">Website</option>
            <option value="others">Others</option>
          </select>
          <select id="filter-sort" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" aria-label="Sort products">
            <option value="popularity">Sort by Popularity</option>
            <option value="price-asc">Sort by Price: Low to High</option>
            <option value="price-desc">Sort by Price: High to Low</option>
          </select>
        </div>
      </div>

      <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Products will be rendered here by JS -->
      </div>
    </section>

    <section id="cart" class="mb-16">
      <h2 class="text-3xl font-bold text-gray-900 mb-6">Shopping Cart</h2>
      <div id="cart-container" class="bg-white rounded-lg shadow p-6 max-w-4xl mx-auto">
        <div id="cart-items" class="divide-y divide-gray-200 max-h-96 overflow-y-auto">
          <p class="text-gray-500 text-center py-10" id="empty-cart-text">Your cart is empty.</p>
        </div>
        <div id="cart-summary" class="mt-6 hidden">
          <div class="flex justify-between text-lg font-semibold text-gray-900 mb-4">
            <span>Total:</span>
            <span id="cart-total">$0</span>
          </div>
          <button id="checkout-button" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-md transition focus:outline-none focus:ring-2 focus:ring-indigo-500" disabled>
            Proceed to Payment
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-white border-t border-gray-200 py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-gray-500 text-sm">
      &copy; 2024 AutomationBot. All rights reserved.
    </div>
  </footer>

  <script>
    // Sample product data with shoppy.gg links
    const products = [
      {
        id: 1,
        title: "tester",
        description: "galow",
        category: "script",
        price: 10,
        popularity: 2550,
        image: "https://placehold.co/600x400/png?text=fsgags",
        alt: "Cover of Mastering React Ebook showing a modern React logo with digital book background",
        shoppyLink: "https://shoppy.gg/product/react-ebook"
      },
      {
        id: 2,
        title: "haljdhd",
        description: "apalah",
        category: "website",
        price: 50,
        popularity: 880,
        image: "https://placehold.co/600x400/png?text=vsbsbsbsbs",
        alt: "Screenshot of Next.js starter template dashboard with clean UI",
        shoppyLink: "https://shoppy.gg/product/nextjs-template"
      },
      {
        id: 3,
        title: "haldhdb",
        description: "nuansbhshsll",
        category: "others",
        price: 27,
        popularity: 2727,
        image: "https://placehold.co/600x400/png?text=ansnsnnssn",
        alt: "Illustration of a person learning JavaScript on a laptop with code snippets",
        shoppyLink: "https://shoppy.gg/product/js-course"
      }
    ];

    // Cart state
    let cart = [];

    // DOM elements
    const productsGrid = document.getElementById("products-grid");
    const cartItemsContainer = document.getElementById("cart-items");
    const cartTotalEl = document.getElementById("cart-total");
    const cartCountEl = document.getElementById("cart-count");
    const cartCountMobileEl = document.getElementById("cart-count-mobile");
    const cartSummary = document.getElementById("cart-summary");
    const emptyCartText = document.getElementById("empty-cart-text");
    const checkoutButton = document.getElementById("checkout-button");
    const filterCategory = document.getElementById("filter-category");
    const filterSort = document.getElementById("filter-sort");
    const mobileMenuButton = document.getElementById("mobile-menu-button");
    const mobileMenu = document.getElementById("mobile-menu");

    // Format price to Indonesian Rupiah
    function formatPrice(price) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'USD' }).format(price);
    }

    // Render products based on filters
    function renderProducts() {
      let filteredProducts = [...products];

      // Filter by category
      const category = filterCategory.value;
      if (category !== "all") {
        filteredProducts = filteredProducts.filter(p => p.category === category);
      }

      // Sort products
      const sort = filterSort.value;
      if (sort === "price-asc") {
        filteredProducts.sort((a, b) => a.price - b.price);
      } else if (sort === "price-desc") {
        filteredProducts.sort((a, b) => b.price - a.price);
      } else if (sort === "popularity") {
        filteredProducts.sort((a, b) => b.popularity - a.popularity);
      }

      productsGrid.innerHTML = "";

      filteredProducts.forEach(product => {
        const productCard = document.createElement("article");
        productCard.className = "bg-white rounded-lg shadow hover:shadow-lg transition overflow-hidden flex flex-col";

        productCard.innerHTML = `
          <img src="${product.image}" alt="${product.alt}" class="w-full h-48 object-cover" loading="lazy" />
          <div class="p-4 flex flex-col flex-grow">
            <h3 class="text-lg font-semibold text-gray-900 mb-2">${product.title}</h3>
            <p class="text-gray-600 flex-grow">${product.description}</p>
            <div class="mt-4 flex items-center justify-between">
              <span class="text-indigo-600 font-bold text-lg">${formatPrice(product.price)}</span>
              <button data-id="${product.id}" class="add-to-cart-btn bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md transition focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <i class="fas fa-cart-plus mr-2"></i> Add to Cart
              </button>
            </div>
          </div>
        `;

        productsGrid.appendChild(productCard);
      });

      // Attach event listeners to add to cart buttons
      document.querySelectorAll(".add-to-cart-btn").forEach(button => {
        button.addEventListener("click", () => {
          const productId = parseInt(button.getAttribute("data-id"));
          addToCart(productId);
        });
      });
    }

    // Add product to cart
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const cartItem = cart.find(item => item.id === productId);
      if (cartItem) {
        cartItem.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      updateCartUI();
    }

    // Remove product from cart
    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCartUI();
    }

    // Update quantity in cart
    function updateQuantity(productId, quantity) {
      if (quantity < 1) return;
      const cartItem = cart.find(item => item.id === productId);
      if (cartItem) {
        cartItem.quantity = quantity;
        updateCartUI();
      }
    }

    // Update cart UI
    function updateCartUI() {
      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p class="text-gray-500 text-center py-10">Your cart is empty.</p>';
        cartSummary.classList.add("hidden");
        checkoutButton.disabled = true;
      } else {
        cartItemsContainer.innerHTML = "";
        cart.forEach(item => {
          const itemEl = document.createElement("div");
          itemEl.className = "flex items-center py-4";

          itemEl.innerHTML = `
            <img src="${item.image}" alt="${item.alt}" class="w-20 h-20 object-cover rounded-md mr-4 flex-shrink-0" />
            <div class="flex-grow">
              <h4 class="font-semibold text-gray-900">${item.title}</h4>
              <p class="text-gray-600">${formatPrice(item.price)} x ${item.quantity} = <span class="font-bold">${formatPrice(item.price * item.quantity)}</span></p>
              <div class="mt-2 flex items-center space-x-2">
                <label for="qty-${item.id}" class="sr-only">Quantity</label>
                <input type="number" id="qty-${item.id}" min="1" value="${item.quantity}" class="w-16 border border-gray-300 rounded-md px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                <button data-id="${item.id}" class="remove-from-cart text-red-600 hover:text-red-800 focus:outline-none" aria-label="Remove ${item.title} from cart">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            </div>
          `;

          cartItemsContainer.appendChild(itemEl);

          // Quantity input event
          const qtyInput = itemEl.querySelector(`#qty-${item.id}`);
          qtyInput.addEventListener("change", (e) => {
            const val = parseInt(e.target.value);
            if (isNaN(val) || val < 1) {
              e.target.value = item.quantity;
              return;
            }
            updateQuantity(item.id, val);
          });

          // Remove button event
          const removeBtn = itemEl.querySelector(".remove-from-cart");
          removeBtn.addEventListener("click", () => {
            removeFromCart(item.id);
          });
        });

        cartSummary.classList.remove("hidden");
        checkoutButton.disabled = false;
      }

      // Update total price
      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      cartTotalEl.textContent = formatPrice(total);

      // Update cart count badges
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      cartCountEl.textContent = totalItems;
      cartCountMobileEl.textContent = totalItems;
    }

    // Checkout button click handler
    checkoutButton.addEventListener("click", () => {
      if (cart.length === 0) return;

      // Build payment URL for shoppy.gg
      // Since each product has a different shoppy.gg link, we will open each product's link in a new tab sequentially
      // Or alternatively, redirect to a custom page that handles multiple products (not available here)
      // For this demo, we will open all product links in new tabs for user to pay separately

      cart.forEach(item => {
        for (let i = 0; i < item.quantity; i++) {
          window.open(item.shoppyLink, "_blank", "noopener,noreferrer");
        }
      });

      alert("You have been redirected to the payment pages for your products. After payment, please follow the instructions on shoppy.gg to download your products.");

      // Clear cart after checkout
      cart = [];
      updateCartUI();
    });

    // Filter change events
    filterCategory.addEventListener("change", renderProducts);
    filterSort.addEventListener("change", renderProducts);

    // Mobile menu toggle
    mobileMenuButton.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });

    // Initial render
    renderProducts();
    updateCartUI();
  </script>
</body>
</html>
