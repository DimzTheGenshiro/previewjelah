<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digital Product Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <div id="root" class="flex-grow"></div>

  <script type="text/javascript">
    const { useState, useEffect } = React;

    // Sample product data (simulate database)
    const PRODUCTS = [
      {
        id: "prod1",
        name: "E-Book: Learn JavaScript",
        description:
          "Comprehensive guide to mastering JavaScript for beginners and intermediates.",
        price: 150000,
        price_id: "price_js_001",
        image:
          "https://placehold.co/400x300/png?text=E-Book+Learn+JavaScript&font=roboto",
        alt: "Cover of an e-book titled Learn JavaScript with colorful code snippets on the background",
      },
      {
        id: "prod2",
        name: "Photoshop Preset Pack",
        description:
          "A set of 20 professional Photoshop presets for enhancing your photos instantly.",
        price: 100000,
        price_id: "price_ps_002",
        image:
          "https://placehold.co/400x300/png?text=Photoshop+Preset+Pack&font=roboto",
        alt: "A collage of before and after photos showing effects of Photoshop presets",
      },
      {
        id: "prod3",
        name: "Music Loops Collection",
        description:
          "50 royalty-free music loops for your video and audio projects.",
        price: 200000,
        price_id: "price_music_003",
        image:
          "https://placehold.co/400x300/png?text=Music+Loops+Collection&font=roboto",
        alt: "Abstract image of sound waves and musical notes in vibrant colors",
      },
      {
        id: "prod4",
        name: "UI Kit for Mobile Apps",
        description:
          "Complete UI kit with 100+ components for mobile app design in Figma and Sketch.",
        price: 250000,
        price_id: "price_ui_004",
        image:
          "https://placehold.co/400x300/png?text=UI+Kit+for+Mobile+Apps&font=roboto",
        alt: "Screenshot of mobile app UI components arranged neatly on a digital canvas",
      },
      {
        id: "prod5",
        name: "Stock Photo Bundle",
        description:
          "A bundle of 500 high-resolution stock photos for commercial use.",
        price: 300000,
        price_id: "price_photo_005",
        image:
          "https://placehold.co/400x300/png?text=Stock+Photo+Bundle&font=roboto",
        alt: "Grid of diverse high-quality stock photos including nature, people, and technology",
      },
      {
        id: "prod6",
        name: "Video Transitions Pack",
        description:
          "Pack of 30 smooth video transitions for professional video editing.",
        price: 120000,
        price_id: "price_video_006",
        image:
          "https://placehold.co/400x300/png?text=Video+Transitions+Pack&font=roboto",
        alt: "Abstract video editing timeline with colorful transition effects preview",
      },
      {
        id: "prod7",
        name: "WordPress Theme",
        description:
          "Modern and responsive WordPress theme suitable for blogs and portfolios.",
        price: 180000,
        price_id: "price_wp_007",
        image:
          "https://placehold.co/400x300/png?text=WordPress+Theme&font=roboto",
        alt: "Screenshot of a clean and modern WordPress blog homepage with images and text",
      },
      {
        id: "prod8",
        name: "3D Model Pack",
        description:
          "Collection of 10 high-quality 3D models for games and animations.",
        price: 350000,
        price_id: "price_3d_008",
        image:
          "https://placehold.co/400x300/png?text=3D+Model+Pack&font=roboto",
        alt: "Rendered 3D models of futuristic vehicles and characters on a neutral background",
      },
      {
        id: "prod9",
        name: "Coding Bootcamp Video Series",
        description:
          "Complete video series to learn full-stack web development from scratch.",
        price: 400000,
        price_id: "price_code_009",
        image:
          "https://placehold.co/400x300/png?text=Coding+Bootcamp+Video+Series&font=roboto",
        alt: "Screenshot of a video player showing coding tutorial with code editor and instructor",
      },
      {
        id: "prod10",
        name: "Social Media Templates",
        description:
          "Pack of 50 editable social media post templates for Instagram and Facebook.",
        price: 90000,
        price_id: "price_social_010",
        image:
          "https://placehold.co/400x300/png?text=Social+Media+Templates&font=roboto",
        alt: "Collage of colorful social media post templates with text and images",
      },
    ];

    // Format price to Indonesian Rupiah format
    function formatPrice(price) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        minimumFractionDigits: 0,
      }).format(price);
    }

    function App() {
      const [products] = useState(PRODUCTS);
      const [cart, setCart] = useState(() => {
        // Load cart from localStorage if available
        if (typeof window !== "undefined") {
          const saved = localStorage.getItem("cart");
          return saved ? JSON.parse(saved) : {};
        }
        return {};
      });

      useEffect(() => {
        if (typeof window !== "undefined") {
          localStorage.setItem("cart", JSON.stringify(cart));
        }
      }, [cart]);

      // Add product to cart
      function addToCart(productId) {
        setCart((prev) => {
          const quantity = prev[productId] ? prev[productId] + 1 : 1;
          return { ...prev, [productId]: quantity };
        });
      }

      // Remove product from cart
      function removeFromCart(productId) {
        setCart((prev) => {
          const newCart = { ...prev };
          delete newCart[productId];
          return newCart;
        });
      }

      // Update quantity in cart
      function updateQuantity(productId, quantity) {
        if (quantity < 1) return;
        setCart((prev) => ({ ...prev, [productId]: quantity }));
      }

      // Calculate total price
      function totalPrice() {
        return Object.entries(cart).reduce((total, [id, qty]) => {
          const product = products.find((p) => p.id === id);
          if (!product) return total;
          return total + product.price * qty;
        }, 0);
      }

      // Calculate total quantity
      function totalQuantity() {
        return Object.values(cart).reduce((a, b) => a + b, 0);
      }

      // Handle checkout: redirect to Shoppy.gg with parameters
      function handleCheckout() {
        if (totalQuantity() === 0) {
          alert("Keranjang belanja kosong!");
          return;
        }
        // Shoppy.gg URL format:
        // https://shoppy.gg/product/M7sh8tl?price_id={price_id}&quantity={quantity}
        // Since we have multiple products, we will redirect to Shoppy.gg product page for each product separately.
        // But Shoppy.gg URL only supports one product at a time.
        // So for this demo, we will redirect to the first product in cart with its quantity.
        // In real scenario, you might want to create a bundle product or handle multiple payments.

        // For better UX, we can open multiple tabs for each product or show a message.
        // Here, we will open multiple tabs for each product in cart.

        Object.entries(cart).forEach(([id, qty]) => {
          const product = products.find((p) => p.id === id);
          if (!product) return;
          const url = `https://shoppy.gg/product/M7sh8tl?price_id=${encodeURIComponent(
            product.price_id
          )}&quantity=${qty}`;
          window.open(url, "_blank");
        });
      }

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col min-h-screen">
          <header className="mb-8 flex flex-col sm:flex-row justify-between items-center">
            <h1 className="text-3xl font-semibold text-gray-900 mb-4 sm:mb-0">
              Digital Product Store
            </h1>
            <CartSummary
              cart={cart}
              products={products}
              totalPrice={totalPrice()}
              totalQuantity={totalQuantity()}
              onRemove={removeFromCart}
              onUpdateQuantity={updateQuantity}
              onCheckout={handleCheckout}
            />
          </header>
          <main className="flex-grow">
            <ProductList products={products} onAddToCart={addToCart} />
          </main>
          <footer className="mt-12 py-6 text-center text-gray-500 text-sm">
            &copy; 2024 Digital Product Store. All rights reserved.
          </footer>
        </div>
      );
    }

    function ProductList({ products, onAddToCart }) {
      return (
        <section>
          <h2 className="text-2xl font-semibold text-gray-800 mb-6">
            Produk Digital
          </h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            {products.map((product) => (
              <div
                key={product.id}
                className="bg-white rounded-lg shadow-md overflow-hidden flex flex-col"
              >
                <img
                  src={product.image}
                  alt={product.alt}
                  className="w-full h-48 object-cover"
                  loading="lazy"
                />
                <div className="p-4 flex flex-col flex-grow">
                  <h3 className="text-lg font-semibold text-gray-900 mb-2">
                    {product.name}
                  </h3>
                  <p className="text-gray-700 flex-grow">{product.description}</p>
                  <div className="mt-4 flex items-center justify-between">
                    <span className="text-indigo-600 font-bold text-lg">
                      {formatPrice(product.price)}
                    </span>
                    <button
                      onClick={() => onAddToCart(product.id)}
                      className="inline-flex items-center px-3 py-1.5 bg-indigo-600 text-white rounded hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      aria-label={`Tambah ${product.name} ke keranjang`}
                    >
                      <i className="fas fa-cart-plus mr-2"></i> Tambah
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    function CartSummary({
      cart,
      products,
      totalPrice,
      totalQuantity,
      onRemove,
      onUpdateQuantity,
      onCheckout,
    }) {
      const [isOpen, setIsOpen] = useState(false);

      // Get cart items with product details
      const cartItems = Object.entries(cart).map(([id, qty]) => {
        const product = products.find((p) => p.id === id);
        return { ...product, quantity: qty };
      });

      return (
        <div className="relative w-full sm:w-auto">
          <button
            onClick={() => setIsOpen((v) => !v)}
            className="relative inline-flex items-center px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            aria-haspopup="true"
            aria-expanded={isOpen}
            aria-label="Toggle keranjang belanja"
          >
            <i className="fas fa-shopping-cart mr-2"></i>
            Keranjang ({totalQuantity})
          </button>

          {isOpen && (
            <div
              className="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg border border-gray-200 z-50"
              role="dialog"
              aria-modal="true"
            >
              <div className="p-4 max-h-96 overflow-y-auto">
                <h3 className="text-lg font-semibold text-gray-900 mb-4">
                  Keranjang Belanja
                </h3>
                {cartItems.length === 0 ? (
                  <p className="text-gray-600">Keranjang kosong.</p>
                ) : (
                  <ul className="divide-y divide-gray-200">
                    {cartItems.map((item) => (
                      <li
                        key={item.id}
                        className="py-3 flex items-center space-x-4"
                      >
                        <img
                          src={item.image}
                          alt={item.alt}
                          className="w-16 h-12 object-cover rounded"
                          loading="lazy"
                        />
                        <div className="flex-1 min-w-0">
                          <p className="text-sm font-medium text-gray-900 truncate">
                            {item.name}
                          </p>
                          <p className="text-sm text-gray-500">
                            {formatPrice(item.price)} x{" "}
                            <input
                              type="number"
                              min="1"
                              value={item.quantity}
                              onChange={(e) =>
                                onUpdateQuantity(
                                  item.id,
                                  Math.max(1, Number(e.target.value))
                                )
                              }
                              className="w-14 text-center border border-gray-300 rounded text-sm"
                              aria-label={`Jumlah ${item.name}`}
                            />
                          </p>
                        </div>
                        <button
                          onClick={() => onRemove(item.id)}
                          className="text-red-600 hover:text-red-800 focus:outline-none"
                          aria-label={`Hapus ${item.name} dari keranjang`}
                        >
                          <i className="fas fa-trash-alt"></i>
                        </button>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
              <div className="border-t border-gray-200 p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between">
                <div className="text-lg font-semibold text-gray-900">
                  Total: {formatPrice(totalPrice)}
                </div>
                <button
                  onClick={() => {
                    setIsOpen(false);
                    onCheckout();
                  }}
                  disabled={totalQuantity() === 0}
                  className={`mt-3 sm:mt-0 inline-flex items-center justify-center px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 disabled:opacity-50 disabled:cursor-not-allowed`}
                  aria-disabled={totalQuantity() === 0}
                >
                  <i className="fas fa-credit-card mr-2"></i> Bayar via Shoppy.gg
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>

  <script
    crossorigin
    src="https://unpkg.com/react@18/umd/react.development.js"
  ></script>
  <script
    crossorigin
    src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
  ></script>
</body>
</html>
