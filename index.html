<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Chat Website</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
  <style>
    .chat-scroll::-webkit-scrollbar {
      width: 8px;
    }
    .chat-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(100, 116, 139, 0.5);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <div id="app" class="flex flex-col md:flex-row flex-1 h-screen">
    <section
      id="user-chat"
      class="w-full md:w-1/2 border-r border-gray-300 flex flex-col"
    >
      <header class="bg-blue-600 text-white p-4 flex items-center justify-center">
        <h1 class="text-xl font-semibold">User Live Chat</h1>
      </header>
      <main class="flex flex-col flex-1 p-4 overflow-hidden">
        <form
          id="userForm"
          class="flex flex-col space-y-4"
          autocomplete="off"
          onsubmit="return false"
        >
          <div>
            <label for="username" class="block text-gray-700 font-medium mb-1"
              >Nama:</label
            >
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Masukkan nama Anda"
              required
              class="w-full rounded border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label for="message" class="block text-gray-700 font-medium mb-1"
              >Pesan:</label
            >
            <textarea
              id="message"
              name="message"
              rows="3"
              placeholder="Tulis pesan Anda di sini..."
              required
              class="w-full rounded border border-gray-300 px-3 py-2 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"
            ></textarea>
          </div>
          <button
            type="submit"
            class="bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-700 transition"
          >
            Kirim Pesan
          </button>
        </form>

        <div
          id="userChatWindow"
          class="mt-6 flex-1 overflow-y-auto border border-gray-300 rounded p-4 bg-white chat-scroll"
          aria-live="polite"
          aria-atomic="false"
        >
          <p class="text-gray-400 text-center">Belum ada pesan terkirim.</p>
        </div>
      </main>
    </section>

    <section
      id="admin-dashboard"
      class="w-full md:w-1/2 flex flex-col bg-white"
      aria-label="Admin Dashboard"
    >
      <header class="bg-gray-800 text-white p-4 flex items-center justify-between">
        <h2 class="text-xl font-semibold">Admin Dashboard</h2>
        <button
          id="btnLogout"
          class="text-gray-300 hover:text-white focus:outline-none"
          title="Logout Admin"
          aria-label="Logout Admin"
        >
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </header>

      <div class="flex flex-1 overflow-hidden">
        <aside
          id="conversationsList"
          class="w-1/3 border-r border-gray-300 overflow-y-auto bg-gray-50 chat-scroll"
          aria-label="Daftar percakapan"
        >
          <div class="p-4 border-b border-gray-300 sticky top-0 bg-gray-50 z-10">
            <h3 class="font-semibold text-gray-700">Percakapan Aktif</h3>
          </div>
          <ul id="conversations" class="divide-y divide-gray-300"></ul>
        </aside>

        <section
          id="chatSection"
          class="flex-1 flex flex-col"
          aria-live="polite"
          aria-atomic="false"
        >
          <div
            id="chatHeader"
            class="p-4 border-b border-gray-300 bg-gray-100 flex items-center justify-between"
          >
            <h3 id="chatWith" class="font-semibold text-gray-700">
              Pilih percakapan
            </h3>
            <button
              id="btnViewHistory"
              class="text-blue-600 hover:underline focus:outline-none"
              aria-label="Lihat riwayat percakapan"
            >
              Riwayat Percakapan
            </button>
          </div>

          <div
            id="chatMessages"
            class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll bg-white"
          >
            <p class="text-gray-400 text-center">Tidak ada percakapan yang dipilih.</p>
          </div>

          <form
            id="adminReplyForm"
            class="p-4 border-t border-gray-300 bg-gray-50 flex space-x-2"
            autocomplete="off"
            onsubmit="return false"
            aria-label="Form balas pesan admin"
          >
            <input
              type="text"
              id="adminReplyInput"
              placeholder="Tulis balasan..."
              class="flex-1 rounded border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              disabled
              aria-disabled="true"
              aria-describedby="replyHelp"
            />
            <button
              type="submit"
              id="btnSendReply"
              class="bg-blue-600 text-white px-4 py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed"
              disabled
              aria-disabled="true"
            >
              Kirim
            </button>
          </form>
        </section>
      </div>

      <div
        id="historyModal"
        class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        role="dialog"
        aria-modal="true"
        aria-labelledby="historyModalTitle"
      >
        <div
          class="bg-white rounded-lg max-w-3xl w-full max-h-[80vh] flex flex-col"
          tabindex="-1"
        >
          <header class="flex justify-between items-center p-4 border-b border-gray-300">
            <h3 id="historyModalTitle" class="text-lg font-semibold text-gray-700">
              Riwayat Percakapan
            </h3>
            <button
              id="btnCloseHistory"
              class="text-gray-600 hover:text-gray-900 focus:outline-none"
              aria-label="Tutup riwayat percakapan"
            >
              <i class="fas fa-times text-xl"></i>
            </button>
          </header>
          <main
            id="historyContent"
            class="p-4 overflow-y-auto flex-1 space-y-4 chat-scroll"
          >
            <p class="text-gray-400 text-center">Memuat riwayat...</p>
          </main>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js" crossorigin="anonymous"></script>
  <script>
    (() => {
      const socket = io();

      const userForm = document.getElementById("userForm");
      const usernameInput = document.getElementById("username");
      const messageInput = document.getElementById("message");
      const userChatWindow = document.getElementById("userChatWindow");

      const conversationsList = document.getElementById("conversations");
      const chatMessages = document.getElementById("chatMessages");
      const chatWith = document.getElementById("chatWith");
      const adminReplyForm = document.getElementById("adminReplyForm");
      const adminReplyInput = document.getElementById("adminReplyInput");
      const btnSendReply = document.getElementById("btnSendReply");
      const btnViewHistory = document.getElementById("btnViewHistory");
      const historyModal = document.getElementById("historyModal");
      const btnCloseHistory = document.getElementById("btnCloseHistory");
      const historyContent = document.getElementById("historyContent");
      const btnLogout = document.getElementById("btnLogout");

      let conversations = {};
      let selectedConversationId = null;

      const notificationAudio = new Audio(
        "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
      );

      function formatTimestamp(ts) {
        const d = new Date(ts);
        return d.toLocaleString("id-ID", {
          hour: "2-digit",
          minute: "2-digit",
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      }

      function scrollChatToBottom(container) {
        container.scrollTop = container.scrollHeight;
      }

      function escapeHtml(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderUserChat() {
        if (!conversations || Object.keys(conversations).length === 0) {
          userChatWindow.innerHTML =
            '<p class="text-gray-400 text-center">Belum ada pesan terkirim.</p>';
          return;
        }
        const username = usernameInput.value.trim();
        if (!username || !conversations) {
          userChatWindow.innerHTML =
            '<p class="text-gray-400 text-center">Belum ada pesan terkirim.</p>';
          return;
        }
        let conv = null;
        for (const convId in conversations) {
          if (conversations[convId].username === username) {
            conv = conversations[convId];
            break;
          }
        }
        if (!conv) {
          userChatWindow.innerHTML =
            '<p class="text-gray-400 text-center">Belum ada pesan terkirim.</p>';
          return;
        }
        userChatWindow.innerHTML = "";
        conv.messages.forEach((msg) => {
          const isUser = msg.from === "user";
          const msgDiv = document.createElement("div");
          msgDiv.className = `mb-3 max-w-[80%] ${
            isUser ? "ml-auto bg-blue-600 text-white" : "bg-gray-200 text-gray-800"
          } rounded px-4 py-2 break-words`;
          msgDiv.innerHTML = `<p>${escapeHtml(msg.text)}</p><time class="block text-xs mt-1 opacity-70">${formatTimestamp(
            msg.timestamp
          )}</time>`;
          userChatWindow.appendChild(msgDiv);
        });
        scrollChatToBottom(userChatWindow);
      }

      function renderConversationsList() {
        conversationsList.innerHTML = "";
        if (!conversations || Object.keys(conversations).length === 0) {
          conversationsList.innerHTML =
            '<li class="p-4 text-gray-400 text-center">Tidak ada percakapan aktif.</li>';
          return;
        }
        for (const convId in conversations) {
          const conv = conversations[convId];
          const lastMsg = conv.messages[conv.messages.length - 1];
          const li = document.createElement("li");
          li.className =
            "p-4 cursor-pointer hover:bg-gray-200 flex justify-between items-center";
          if (convId === selectedConversationId) {
            li.classList.add("bg-blue-100");
          }
          li.setAttribute("data-convid", convId);
          li.setAttribute("tabindex", "0");
          li.setAttribute("role", "button");
          li.setAttribute("aria-pressed", convId === selectedConversationId ? "true" : "false");
          li.innerHTML = `
            <div>
              <p class="font-semibold text-gray-800">${escapeHtml(conv.username)}</p>
              <p class="text-sm text-gray-600 truncate max-w-[180px]">${escapeHtml(
                lastMsg.text
              )}</p>
            </div>
            <time class="text-xs text-gray-500">${formatTimestamp(lastMsg.timestamp)}</time>
          `;
          li.addEventListener("click", () => {
            selectConversation(convId);
          });
          li.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              selectConversation(convId);
            }
          });
          conversationsList.appendChild(li);
        }
      }

      function renderChatMessages() {
        if (!selectedConversationId || !conversations[selectedConversationId]) {
          chatWith.textContent = "Pilih percakapan";
          chatMessages.innerHTML =
            '<p class="text-gray-400 text-center">Tidak ada percakapan yang dipilih.</p>';
          adminReplyInput.value = "";
          adminReplyInput.disabled = true;
          btnSendReply.disabled = true;
          adminReplyInput.setAttribute("aria-disabled", "true");
          btnSendReply.setAttribute("aria-disabled", "true");
          return;
        }
        const conv = conversations[selectedConversationId];
        chatWith.textContent = `Chat dengan: ${conv.username}`;
        chatMessages.innerHTML = "";
        conv.messages.forEach((msg) => {
          const isUser = msg.from === "user";
          const msgDiv = document.createElement("div");
          msgDiv.className = `mb-3 max-w-[80%] ${
            isUser ? "bg-gray-200 text-gray-800 self-start" : "bg-blue-600 text-white self-end"
          } rounded px-4 py-2 break-words`;
          msgDiv.innerHTML = `<p>${escapeHtml(msg.text)}</p><time class="block text-xs mt-1 opacity-70">${formatTimestamp(
            msg.timestamp
          )}</time>`;
          chatMessages.appendChild(msgDiv);
        });
        scrollChatToBottom(chatMessages);
        adminReplyInput.disabled = false;
        btnSendReply.disabled = false;
        adminReplyInput.setAttribute("aria-disabled", "false");
        btnSendReply.setAttribute("aria-disabled", "false");
        adminReplyInput.focus();
      }

      function selectConversation(convId) {
        selectedConversationId = convId;
        renderConversationsList();
        renderChatMessages();
      }

      function generateConversationId(username) {
        return username.toLowerCase().replace(/\s+/g, "_");
      }

      userForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim();
        const message = messageInput.value.trim();
        if (!username || !message) return;

        const convId = generateConversationId(username);

        socket.emit("userMessage", { convId, username, text: message, timestamp: Date.now() });

        if (!conversations[convId]) {
          conversations[convId] = { username, messages: [] };
        }
        conversations[convId].messages.push({ from: "user", text: message, timestamp: Date.now() });

        renderUserChat();
        messageInput.value = "";
        messageInput.focus();
      });

      adminReplyForm.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!selectedConversationId) return;
        const replyText = adminReplyInput.value.trim();
        if (!replyText) return;

        socket.emit("adminMessage", {
          convId: selectedConversationId,
          text: replyText,
          timestamp: Date.now(),
        });

        conversations[selectedConversationId].messages.push({
          from: "admin",
          text: replyText,
          timestamp: Date.now(),
        });

        renderChatMessages();
        adminReplyInput.value = "";
        adminReplyInput.focus();
      });

      socket.on("messageToAdmin", (data) => {
        if (!conversations[data.convId]) {
          conversations[data.convId] = { username: data.username, messages: [] };
        }
        conversations[data.convId].messages.push({
          from: "user",
          text: data.text,
          timestamp: data.timestamp,
        });

        notificationAudio.play().catch(() => {});

        renderConversationsList();

        if (selectedConversationId === data.convId) {
          renderChatMessages();
        }
      });

      socket.on("messageToUser", (data) => {
        if (!conversations[data.convId]) return;
        conversations[data.convId].messages.push({
          from: "admin",
          text: data.text,
          timestamp: data.timestamp,
        });

        const username = usernameInput.value.trim();
        if (username && generateConversationId(username) === data.convId) {
          renderUserChat();
        }

        if (selectedConversationId === data.convId) {
          renderChatMessages();
        }
      });

      socket.on("initialConversations", (data) => {
        conversations = data || {};
        renderConversationsList();
        renderUserChat();
      });

      btnViewHistory.addEventListener("click", () => {
        if (!selectedConversationId) return;
        historyModal.classList.remove("hidden");
        loadHistory(selectedConversationId);
      });

      btnCloseHistory.addEventListener("click", () => {
        historyModal.classList.add("hidden");
        historyContent.innerHTML = '<p class="text-gray-400 text-center">Memuat riwayat...</p>';
      });

      function loadHistory(convId) {
        socket.emit("getHistory", convId);
      }

      socket.on("historyData", (data) => {
        if (!data || !data.history) {
          historyContent.innerHTML =
            '<p class="text-gray-400 text-center">Riwayat tidak ditemukan.</p>';
          return;
        }
        if (data.history.length === 0) {
          historyContent.innerHTML =
            '<p class="text-gray-400 text-center">Riwayat kosong.</p>';
          return;
        }
        historyContent.innerHTML = "";
        data.history.forEach((msg) => {
          const isUser = msg.from === "user";
          const msgDiv = document.createElement("div");
          msgDiv.className = `mb-3 max-w-[80%] ${
            isUser ? "bg-gray-200 text-gray-800 self-start" : "bg-blue-600 text-white self-end"
          } rounded px-4 py-2 break-words`;
          msgDiv.innerHTML = `<p>${escapeHtml(msg.text)}</p><time class="block text-xs mt-1 opacity-70">${formatTimestamp(
            msg.timestamp
          )}</time>`;
          historyContent.appendChild(msgDiv);
        });
        scrollChatToBottom(historyContent);
      });

      btnLogout.addEventListener("click", () => {
        if (confirm("Apakah Anda yakin ingin logout?")) {
          location.reload();
        }
      });

      usernameInput.addEventListener("input", () => {
        renderUserChat();
      });

      socket.emit("requestInitialConversations");

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !historyModal.classList.contains("hidden")) {
          historyModal.classList.add("hidden");
          historyContent.innerHTML = '<p class="text-gray-400 text-center">Memuat riwayat...</p>';
        }
      });
    })();
  </script>
</body>
</html>
